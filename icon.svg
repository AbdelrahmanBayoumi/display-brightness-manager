<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242220"/>
      <stop offset="100%" stop-color="#141312"/>
    </linearGradient>

    <!-- Warm Amber Glow Gradient -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe699"/>
      <stop offset="50%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#fb8500"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="108" ry="108" fill="url(#bgGrad)" stroke="#3d3730" stroke-width="6" filter="url(#shadow)"/>

  <!-- Sun Symbol with Rays -->
  <g filter="url(#glow)">
    <!-- Sun Core -->
    <circle cx="256" cy="150" r="32" fill="url(#amberGrad)" stroke="#ffe699" stroke-width="4"/>

    <!-- Sun Rays -->
    <!-- Top & Bottom -->
    <line x1="256" y1="95" x2="256" y2="110" stroke="url(#amberGrad)" stroke-width="6" stroke-linecap="round"/>
    <line x1="256" y1="190" x2="256" y2="205" stroke="url(#amberGrad)" stroke-width="6" stroke-linecap="round"/>
    <!-- Left & Right -->
    <line x1="201" y1="150" x2="216" y2="150" stroke="url(#amberGrad)" stroke-width="6" stroke-linecap="round"/>
    <line x1="296" y1="150" x2="311" y2="150" stroke="url(#amberGrad)" stroke-width="6" stroke-linecap="round"/>
    <!-- Diagonals -->
    <line x1="217" y1="111" x2="228" y2="122" stroke="url(#amberGrad)" stroke-width="6" stroke-linecap="round"/>
    <line x1="284" y1="178" x2="295" y2="189" stroke="url(#amberGrad)" stroke-width="6" stroke-linecap="round"/>
    <line x1="217" y1="189" x2="228" y2="178" stroke="url(#amberGrad)" stroke-width="6" stroke-linecap="round"/>
    <line x1="284" y1="122" x2="295" y2="111" stroke="url(#amberGrad)" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Multi-Monitor Setup -->
  <g filter="url(#glow)">
    <!-- Center Main Display (HP Z27n) -->
    <rect x="180" y="240" width="152" height="105" rx="10" ry="10" fill="#1e1e24" stroke="url(#amberGrad)" stroke-width="8"/>
    <!-- Stand -->
    <line x1="256" y1="345" x2="256" y2="385" stroke="url(#amberGrad)" stroke-width="8" stroke-linecap="round"/>
    <line x1="225" y1="385" x2="287" y2="385" stroke="url(#amberGrad)" stroke-width="8" stroke-linecap="round"/>

    <!-- Left Display (Angled) -->
    <polygon points="68,230 162,248 162,342 68,360" fill="#1e1e24" stroke="url(#amberGrad)" stroke-width="8" stroke-linejoin="round"/>
    <line x1="115" y1="352" x2="115" y2="385" stroke="url(#amberGrad)" stroke-width="8" stroke-linecap="round"/>
    <line x1="90" y1="385" x2="140" y2="385" stroke="url(#amberGrad)" stroke-width="8" stroke-linecap="round"/>

    <!-- Right Display (Angled) -->
    <polygon points="444,230 350,248 350,342 444,360" fill="#1e1e24" stroke="url(#amberGrad)" stroke-width="8" stroke-linejoin="round"/>
    <line x1="397" y1="352" x2="397" y2="385" stroke="url(#amberGrad)" stroke-width="8" stroke-linecap="round"/>
    <line x1="372" y1="385" x2="422" y2="385" stroke="url(#amberGrad)" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
